[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "orders-common"
version = "1.4.0"
description = "Shared models, types and event envelopes used by the orders platform services"
requires-python = ">=3.9"
dependencies = [
    "pydantic>=1.10,<2",
    "email-validator>=1.3",
]

[tool.setuptools]
packages = ["orders_common"]
